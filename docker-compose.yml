# Postal Pigeon, the Hedgerow push relay. One container, one SQLite database.
#
# Before the first start (see README.md, "Run it"):
#   mkdir secrets
#   cp AuthKey_XXXXXXXXXX.p8 secrets/apns.p8   # the key from Apple; never in the image or the repository
#   docker run --rm --user "$(id -u):$(id -g)" -v ./secrets:/s ghcr.io/ferdinand99/postal-pigeon keygen /s/seal.key
#   docker run --rm --user "$(id -u):$(id -g)" -v ./secrets:/s ghcr.io/ferdinand99/postal-pigeon keygen /s/hmac.key
#   sudo chown 1000:1000 secrets/*; sudo chmod 0400 secrets/*
services:
  postal-pigeon:
    image: ghcr.io/ferdinand99/postal-pigeon:latest
    # build: .   # build from this checkout instead of pulling the image
    container_name: postal-pigeon
    restart: unless-stopped
    # Plain HTTP on the loopback interface only; a reverse proxy on the host
    # terminates TLS for the public host name.
    ports:
      - "127.0.0.1:3016:3010"
    volumes:
      - pigeon-data:/data
      # The APNs key and the two relay keys, read-only (mode 0400, owner uid 1000).
      - ./secrets:/run/secrets:ro
    environment:
      - PP_APNS_KEY_PATH=/run/secrets/apns.p8
      - PP_APNS_KEY_ID=XXXXXXXXXX # the key's id, shown by Apple
      - PP_APNS_TEAM_ID=YYYYYYYYYY # your Apple developer team id
      - PP_APNS_ENVIRONMENT=production,sandbox
      - PP_APPS=hedgerow=com.example.hedgerow # id=bundle id[:alert+sync], comma separated
      - PP_SEAL_KEY_FILE=/run/secrets/seal.key
      - PP_HMAC_KEY_FILE=/run/secrets/hmac.key
      - PP_PUBLIC_URL=https://pigeon.example.com
      # The proxy's address as the container sees it (the Docker bridge's
      # gateway for a proxy on the host). Only these are believed about
      # X-Forwarded-For.
      - PP_TRUSTED_PROXIES=172.16.0.0/12
      # - RUST_LOG=info
    # Hardening (docs/design.md section 11): no root, no capabilities, nothing
    # writable but the data volume.
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3010/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pigeon-data:
