# Postal Pigeon, the Hedgerow push relay. One container, one SQLite database.
#
# Before the first start (see README.md, "Run it"):
#   mkdir secrets
#   cp AuthKey_XXXXXXXXXX.p8 secrets/apns.p8   # the key from Apple; never in the image or the repository
#   docker run --rm --user "$(id -u):$(id -g)" -v ./secrets:/s ghcr.io/ferdinand99/postal-pigeon keygen /s/seal.key
#   docker run --rm --user "$(id -u):$(id -g)" -v ./secrets:/s ghcr.io/ferdinand99/postal-pigeon keygen /s/hmac.key
#   sudo chown 1000:1000 secrets/*; sudo chmod 0400 secrets/*
services:
  postal-pigeon:
    # Pin a released version; update it deliberately (and read the release notes)
    # rather than following :latest. 0.1.0 is the first release: release-please
    # starts from 0.0.0 (Cargo.toml and .release-please-manifest.json) and the
    # v1 work is a feat, so its release PR is 0.1.0 and the image tag is 0.1.0
    # (initial-version in release-please-config.json says the same). The tag
    # exists once that release PR is merged.
    image: ghcr.io/ferdinand99/postal-pigeon:0.1.0
    # build: .   # build from this checkout instead of pulling the image
    container_name: postal-pigeon
    restart: unless-stopped
    # Plain HTTP on the loopback interface only; a reverse proxy on the host
    # terminates TLS for the public host name.
    ports:
      - "127.0.0.1:3016:3010"
    volumes:
      - pigeon-data:/data
      # The APNs key and the two relay keys, read-only (mode 0400, owner uid 1000).
      - ./secrets:/run/secrets:ro
    environment:
      - PP_APNS_KEY_PATH=/run/secrets/apns.p8
      - PP_APNS_KEY_ID=XXXXXXXXXX # the key's id, shown by Apple
      - PP_APNS_TEAM_ID=YYYYYYYYYY # your Apple developer team id
      - PP_APNS_ENVIRONMENT=production,sandbox
      - PP_APPS=hedgerow=com.example.hedgerow # id=bundle id[:alert+sync], comma separated; Sylo: sylo=net.opland.sylo:alert
      - PP_SEAL_KEY_FILE=/run/secrets/seal.key
      - PP_HMAC_KEY_FILE=/run/secrets/hmac.key
      - PP_PUBLIC_URL=https://pigeon.example.com
      # ONE address: the reverse proxy as the container sees it. The network
      # below is fixed so that, for a proxy on the host, it is the bridge gateway
      # 172.30.16.1. Only this address is believed about X-Forwarded-For; a wide
      # network here would let anyone on it pick their own client address. The
      # relay refuses to start without it (PP_ALLOW_NO_PROXY=1 overrides).
      - PP_TRUSTED_PROXIES=172.30.16.1/32
      # - RUST_LOG=info   # sets the relay's own level only
    # Hardening (docs/design.md section 11): no root, no capabilities, nothing
    # writable but the data volume.
    user: "1000:1000"
    read_only: true
    tmpfs:
      # Only the shared APNs provider token lives here: small, and nothing runs from it.
      - /tmp:size=16m,noexec,nosuid,nodev
    # A runaway relay can not take the host with it.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 200
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3010/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pigeon-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.16.0/24
