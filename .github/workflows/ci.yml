# Format, lints and tests for every pull request and every push to main, plus
# Docker builds of the image for both architectures on pull requests (nothing
# is pushed). The tests use a mock APNs server and never call Apple. The
# toolchain matches rust-toolchain.toml and the Dockerfile's RUST_VERSION.
# Every action is pinned to a commit; Dependabot updates the pins.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          toolchain: "1.99"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  docker:
    # Builds the image for linux/amd64 and linux/arm64 on native runners (no
    # QEMU) to catch Dockerfile breakage before merging. Cache only;
    # publishing is docker-publish.yml's job.
    name: Docker ${{ matrix.platform }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Platform slug
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | sed 's#/#-#g' >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            REVISION=${{ github.sha }}
          # Same cache scopes as docker-publish.yml, so pull requests reuse
          # main's layers.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=cacheonly
