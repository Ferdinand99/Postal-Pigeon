version: 2
updates:
  # Rust crates: one grouped PR a week for minor and patch updates;
  # security updates come on their own as soon as an advisory is out.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    ignore:
      # Its toolchain input picks the Rust version, not the action's version.
      - dependency-name: dtolnay/rust-toolchain
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
