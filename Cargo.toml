[package]
name = "postal-pigeon"
# release-please bumps this (release-please-config.json); 0.1.0 is the first release.
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/Ferdinand99/Postal-Pigeon"
description = "The Hedgerow push relay: a content-free doorbell between self-hosted servers and iOS push."
publish = false

[lib]
name = "postal_pigeon"
path = "src/lib.rs"

[[bin]]
name = "postal-pigeon"
path = "src/main.rs"

# Deliberately lean (docs/design.md section 17): no vole-kit, no templates, no
# sign-in. Crypto is aws-lc-rs only (AES-GCM, HKDF, HMAC, SHA-256, ES256).
[dependencies]
aws-lc-rs = "1.18.2"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
# The mock APNs server in the tests speaks cleartext HTTP/2 (h2c).
axum = { version = "0.8.9", features = ["http2"] }
